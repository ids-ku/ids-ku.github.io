<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Learning and decision-making</title>
  <desc id="desc">A feedback loop links observation, decisions, and actions. Feedback from the environment supports repeated decisions when information is limited or delayed.</desc>
  <defs>
    <marker id="decision-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#527b91" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="Source Sans 3, Segoe UI, Arial, sans-serif" fill="#17232b">
    <text x="240" y="32" text-anchor="middle" font-size="18" fill="#527b91">Decisions under uncertainty</text>
    <g fill="none" stroke="#527b91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M133 101 H189" marker-end="url(#decision-arrow)"/>
      <path d="M283 101 H339" marker-end="url(#decision-arrow)"/>
      <path d="M384 158 V191 Q384 208 367 208 H107 Q90 208 90 191 V161" stroke-dasharray="5 5" marker-end="url(#decision-arrow)"/>
    </g>
    <g fill="none" stroke="#17232b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 101 Q90 62 124 101 Q90 140 56 101 Z" fill="#e6eef2"/>
      <circle cx="90" cy="101" r="11" fill="#527b91" stroke="none"/>
      <path d="M207 101 H227 M227 101 L252 78 M227 101 L252 101 M227 101 L252 124"/>
      <circle cx="207" cy="101" r="5" fill="#527b91" stroke="none"/>
      <circle cx="258" cy="76" r="6" fill="#e6eef2"/>
      <circle cx="258" cy="101" r="6" fill="#b57d45" stroke="#b57d45"/>
      <circle cx="258" cy="126" r="6" fill="#e6eef2"/>
      <path d="M356 93 H383 V78 L414 101 383 124 V109 H356 Z" fill="#e6eef2" stroke="#527b91"/>
    </g>
    <text x="90" y="151" text-anchor="middle" font-size="20">Observe</text>
    <text x="237" y="151" text-anchor="middle" font-size="20">Decide</text>
    <text x="384" y="151" text-anchor="middle" font-size="20">Act</text>
    <rect x="190" y="193" width="94" height="28" fill="#fff"/>
    <text x="237" y="213" text-anchor="middle" font-size="18" fill="#527b91">Feedback</text>
    <text x="237" y="247" text-anchor="middle" font-size="16" fill="#6b7780">Limited or delayed information</text>
  </g>
</svg>
